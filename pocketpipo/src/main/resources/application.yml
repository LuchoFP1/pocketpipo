server:
  port: 8080
spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: pocketpipo-notifications
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.pocketpipo.pocketpipo.dto"
  datasource:
    url: jdbc:postgresql://localhost:5432/pocketpipo_db
    username: pipo_user
    password: nambiap1p02dge12k
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  web:
    error:
      include-message: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId}] %logger{36} - %msg%n"

app:
  jwt:
    secret: "D4WGECE3FH2FGDRFH4DD4GD2DFEG2D2D"
    expiration-ms: 3600000 # 1 hour
